name: CI

# Baut und prueft bei jedem Push und jedem Pull Request:
#  1. Schema und Datenmodell: Typen, Tests, Katalog-Validator
#  2. Web-Bau (dist/) als Artefakt
#  3. Android-Debug-APK ueber denselben Bauweg wie auf dem Geraet (ohne Gradle)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruefen:
    name: Schema, Tests, Validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typen
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Katalog pruefen
        run: npm run validate

  web:
    name: Web-Bau
    runs-on: ubuntu-latest
    needs: pruefen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Oberflaeche im Kopflosen Chromium pruefen
        run: bash scripts/ui-smoke.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

  android:
    name: Android-Debug-APK
    runs-on: ubuntu-latest
    needs: pruefen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Debug-Schluessel erzeugen
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias mlapp-debug -storepass android -keypass android \
            -dname "CN=MLapp Debug" -keyalg RSA -keysize 2048 -validity 3650
      - name: APK bauen
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/debug.keystore
          ANDROID_KEYSTORE_PASSWORT: android
          ANDROID_KEY_ALIAS: mlapp-debug
        run: |
          # Rahmenwerk-Jar aus der auf dem Laeufer vorhandenen Plattform nehmen.
          export ANDROID_JAR="$(ls -d "$ANDROID_HOME"/platforms/android-3* 2>/dev/null | sort | tail -1)/android.jar"
          echo "Rahmenwerk: $ANDROID_JAR"
          test -f "$ANDROID_JAR"
          bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mlapp-debug-apk
          path: android/build/*.apk
