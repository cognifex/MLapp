name: CI

# Baut und prueft bei jedem Push und jedem Pull Request:
#  1. Schema und Datenmodell: Typen, Tests, Katalog-Validator
#  2. Web-Bau (dist/) als Artefakt samt Oberflaechenmessung
#  3. Android-Debug-APK ueber denselben Bauweg wie auf dem Geraet (ohne Gradle)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruefen:
    name: Schema, Tests, Validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typen
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Katalog pruefen
        run: npm run validate

  web:
    name: Web-Bau
    runs-on: ubuntu-latest
    needs: pruefen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Oberflaeche im Kopflosen Chromium pruefen
        run: bash scripts/ui-smoke.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

  android:
    name: Android-Debug-APK
    runs-on: ubuntu-latest
    needs: pruefen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Debug-Schluessel erzeugen
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias mlapp-debug -storepass android -keypass android \
            -dname "CN=MLapp Debug" -keyalg RSA -keysize 2048 -validity 3650
      - name: APK bauen
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/debug.keystore
          ANDROID_KEYSTORE_PASSWORT: android
          ANDROID_KEY_ALIAS: mlapp-debug
        run: |
          # Rahmenwerk-Jar und Bauwerkzeuge des Laeufers benutzen. Der alte aapt ist in
          # neueren build-tools nicht mehr enthalten; dann wird 33.0.2 nachinstalliert.
          PLATFORM="$(ls -d "$ANDROID_HOME"/platforms/android-35 2>/dev/null || ls -d "$ANDROID_HOME"/platforms/android-3* | sort -V | tail -1)"
          export ANDROID_JAR="$PLATFORM/android.jar"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          export PATH="$BUILD_TOOLS:$PATH"
          if ! command -v aapt >/dev/null 2>&1; then
            echo "aapt fehlt in $BUILD_TOOLS - installiere build-tools 33.0.2"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "build-tools;33.0.2" > /dev/null
            export PATH="$ANDROID_HOME/build-tools/33.0.2:$PATH"
          fi
          echo "Rahmenwerk: $ANDROID_JAR"
          command -v aapt d8 zipalign apksigner
          test -f "$ANDROID_JAR"
          bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mlapp-debug-apk
          path: android/build/*.apk
