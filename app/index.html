<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>MLapp – Machine Learning lernen</title>
    <link rel="stylesheet" href="/app/styles/app.css" />
  </head>
  <body>
    <a class="skip" href="#inhalt">Zum Inhalt springen</a>
    <header class="app-header">
      <button class="icon-button" id="zurueck" type="button" aria-label="Zurueck" hidden>‹</button>
      <h1 id="kopfzeile">MLapp</h1>
      <button class="icon-button" id="einstellungen-knopf" type="button" aria-label="Einstellungen">
        ⚙
      </button>
    </header>

    <main id="inhalt" class="app-main" role="main">
      <p class="hinweis" id="ladehinweis">Wird geladen …</p>
    </main>

    <div class="vollbild" id="vollbild" hidden>
      <div class="vollbild-kopf">
        <h2 id="vollbild-titel">Experiment</h2>
        <button class="icon-button" type="button" id="vollbild-zu" aria-label="Vollbild schliessen">
          ✕
        </button>
      </div>
      <div id="vollbild-inhalt"></div>
    </div>

    <dialog id="einstellungen" class="einstellungen">
      <form method="dialog">
        <h2>Einstellungen</h2>
        <div id="einstellungen-inhalt"></div>
        <button class="knopf" type="submit">Schliessen</button>
      </form>
    </dialog>

    <div class="vorleser" id="vorleser" hidden>
      <div class="vorleser-text" id="vorleser-text"></div>
      <div class="vorleser-knoepfe">
        <button class="icon-button" type="button" id="vz-zurueck" aria-label="Vorheriger Abschnitt">
          ⏮
        </button>
        <button class="icon-button" type="button" id="vz-spielen" aria-label="Lesen starten">
          ▶
        </button>
        <button class="icon-button" type="button" id="vz-vor" aria-label="Naechster Abschnitt">
          ⏭
        </button>
        <label class="tempo">
          <span>Tempo</span>
          <input type="range" id="vz-tempo" min="0.5" max="2" step="0.05" value="1" />
        </label>
      </div>
    </div>

    <script type="module" src="/app/src/main.js"></script>
  </body>
</html>
